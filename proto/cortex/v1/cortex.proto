syntax = "proto3";

package cortex.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/thomas-maurice/cortex/gen/cortex/v1;cortexv1";

// MemoryService is the single entry point to the Cortex second brain. The MCP
// server and the cortex CLI are thin clients of this service: all access to
// NATS (writes) and Weaviate/Ollama (reads) happens server-side, never in the
// clients.
service MemoryService {
  // Save queues a memory for asynchronous, durable indexing (NATS JetStream).
  rpc Save(SaveRequest) returns (SaveResponse) {}
  // UpdateMemory edits an existing memory and re-embeds it through the worker.
  // It preserves the memory's id, creation time, source, conversation, links and
  // dedup decisions; only text (always) and, opt-in, tags/namespace change. Like
  // Save it is asynchronous: the new vector lands once the worker re-indexes.
  rpc UpdateMemory(UpdateMemoryRequest) returns (UpdateMemoryResponse) {}
  // Search runs a semantic (vector) search over stored memories.
  rpc Search(SearchRequest) returns (SearchResponse) {}
  // SearchSimilar finds memories similar to an EXISTING memory (by id), reusing
  // that memory's stored vector — it never re-embeds. Use it for "more like this
  // one" instead of feeding a memory's own text back through Search.
  rpc SearchSimilar(SearchSimilarRequest) returns (SearchSimilarResponse) {}
  // PreviewRecall dry-runs the Claude Code UserPromptSubmit recall hook for a
  // prompt: which memories WOULD be injected, which just missed (and why), and
  // whether the prompt would be skipped. Same query logic as `cortex hook recall`
  // (internal/recall). Tenant-scoped; never reinforces. Per-session dedup is
  // client-local state and is NOT simulated.
  rpc PreviewRecall(PreviewRecallRequest) returns (PreviewRecallResponse) {}
  // List returns stored memories newest-first, without a vector query.
  rpc List(ListRequest) returns (ListResponse) {}
  // GetMemory fetches ONE memory by id (full record, tenant-scoped). Use it to
  // follow `linked_ids` from search results or ids from dedup candidates and
  // consolidate manifests. It is a plain read: unlike Search it never
  // reinforces the memory. NotFound for an unknown id or another tenant's id.
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse) {}
  // Delete removes a memory by ID.
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}
  // Status is a fast health/connectivity probe of the backing services.
  rpc Status(StatusRequest) returns (StatusResponse) {}
  // GetVersion reports the server's build version. Intentionally
  // UNAUTHENTICATED (exempted in the auth interceptor): clients use it to
  // decide whether their binaries are compatible or need upgrading (`cortex
  // upgrade`) before they have working credentials. It exposes nothing but
  // the version string.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse) {}
  // Doctor runs deeper diagnostics and returns a per-check breakdown.
  rpc Doctor(DoctorRequest) returns (DoctorResponse) {}
  // Reindex re-embeds memories through the worker (e.g. after a model change).
  rpc Reindex(ReindexRequest) returns (ReindexResponse) {}
  // Dead manages dead-lettered memories (list / requeue / purge).
  rpc Dead(DeadRequest) returns (DeadResponse) {}
  // IndexQueue reports the live state of the async indexing queue.
  rpc IndexQueue(IndexQueueRequest) returns (IndexQueueResponse) {}
  // PullModel asks the local Ollama instance to download the configured
  // embedding model. Blocks until the pull completes.
  rpc PullModel(PullModelRequest) returns (PullModelResponse) {}
  // SummarizeSession upserts the ever-current summary for one conversation.
  rpc SummarizeSession(SummarizeSessionRequest) returns (SummarizeSessionResponse) {}
  // RecallSession vector-matches a conversation summary and returns it together
  // with the individual facts saved during that conversation.
  rpc RecallSession(RecallSessionRequest) returns (RecallSessionResponse) {}
  // ListSummaries lists conversation summaries, most-recently-updated first.
  rpc ListSummaries(ListSummariesRequest) returns (ListSummariesResponse) {}
  // Link creates a bidirectional link between two memories (id <-> target_id).
  rpc Link(LinkRequest) returns (LinkResponse) {}
  // Unlink removes the bidirectional link between two memories.
  rpc Unlink(UnlinkRequest) returns (UnlinkResponse) {}
  // ListDuplicateCandidates returns memories the worker flagged as likely
  // duplicates, each with the resolved candidate memories, for human/agent review.
  rpc ListDuplicateCandidates(ListDuplicateCandidatesRequest) returns (ListDuplicateCandidatesResponse) {}
  // DismissDuplicate records that two memories are confirmed NOT duplicates, so
  // the worker stops re-flagging the pair on future re-indexing.
  rpc DismissDuplicate(DismissDuplicateRequest) returns (DismissDuplicateResponse) {}
  // Consolidate gathers the cluster of memories about a topic — the vector
  // matches plus their linked and duplicate-candidate neighbours — so a client
  // (the LLM) can merge them into fewer, richer memories. It is READ-ONLY: it
  // never writes or deletes. The merge is committed by saving the compiled
  // memories with SaveRequest.supersedes set to the obsolete ids from the
  // returned manifest; the worker then deletes those sources once the
  // replacement is durably indexed.
  rpc Consolidate(ConsolidateRequest) returns (ConsolidateResponse) {}
  // RestoreMemories re-ingests memories from a dump (e.g. `cortex export`) by
  // republishing each onto the SAME NATS index queue a normal save uses — the
  // worker then re-embeds and upserts them. It is the import half of dump/restore
  // (move a store between deployments). Vectors are NOT carried; they are
  // recomputed by the target worker's current model, so a restore is safe across
  // model changes. Ids, namespace, tags, createdAt, links and not-duplicate
  // decisions are preserved; an existing id is overwritten (upsert).
  rpc RestoreMemories(RestoreMemoriesRequest) returns (RestoreMemoriesResponse) {}
  // ListNamespaces aggregates the stored namespaces with per-namespace counts
  // (memories + conversation summaries) and the most recent activity, for the
  // UI's namespace admin view.
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse) {}
  // RenameNamespace moves every memory AND conversation summary from one
  // namespace to another. It is a metadata-only change (namespace is never
  // embedded), so nothing is re-embedded; renaming into an existing namespace
  // merges the two.
  rpc RenameNamespace(RenameNamespaceRequest) returns (RenameNamespaceResponse) {}
  // DeleteNamespace permanently deletes every memory AND conversation summary in
  // a namespace.
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse) {}
  // ListTags aggregates the tags in use (memory count + last activity),
  // optionally within one namespace, so drifted spellings (k8s / kubernetes /
  // K8s) can be seen and merged.
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse) {}
  // RenameTag replaces a tag with another on every memory and its chunks
  // (merging when the target already exists). Metadata-only: no re-embed.
  // Single-flight per tenant (scans the whole tenant).
  rpc RenameTag(RenameTagRequest) returns (RenameTagResponse) {}
  // DeleteTag removes a tag from every memory (the memories are kept).
  // Single-flight per tenant.
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse) {}
  // ListTrash lists the caller's trashed (soft-deleted) memories, newest
  // deletion first. Deletes (Delete, supersedes, DeleteNamespace) move the record
  // into a Trash class instead of destroying it; entries expire after the
  // server's TRASH_RETENTION.
  rpc ListTrash(ListTrashRequest) returns (ListTrashResponse) {}
  // RestoreFromTrash re-queues trashed memories through the normal index path
  // (the worker re-embeds), keeping their ids, and removes them from the trash.
  // NotFound for an unknown id; AlreadyExists when a live memory has that id.
  rpc RestoreFromTrash(RestoreFromTrashRequest) returns (RestoreFromTrashResponse) {}
  // PurgeTrash permanently deletes trashed memories (by ids, or all).
  rpc PurgeTrash(PurgeTrashRequest) returns (PurgeTrashResponse) {}
  // MigrateMT performs a one-shot migration from a non-MT store to a
  // multi-tenant store: it snapshots all memories and summaries, drops the
  // three memory classes, recreates them with MT enabled, and re-imports every
  // record into the bootstrap admin's tenant via the NATS index queue (the
  // worker re-embeds and rechunks on import). Refuses if CORTEX_MULTI_TENANT is
  // off or if the classes are already MT (nothing to migrate). Safe to retry
  // after a partial failure — re-import is upsert-by-id.
  rpc MigrateMT(MigrateMTRequest) returns (MigrateMTResponse) {}

  // ---- Self-service backup (any authenticated user) ----
  // BackupSelf returns a backup of the CALLER's OWN data — their tenant's
  // memories and conversation summaries — as a downloadable file. Not
  // admin-gated: everyone may back up their own data, never anyone else's.
  rpc BackupSelf(BackupSelfRequest) returns (BackupSelfResponse) {}
  // RestoreSelf restores a BackupSelf file into the CALLER's OWN tenant.
  // Tenant attribution inside the uploaded file is IGNORED — a user can only
  // ever restore into themselves. Records re-queue through the index queue
  // (worker re-embeds); upsert-by-id makes it safe to re-run.
  rpc RestoreSelf(RestoreSelfRequest) returns (RestoreSelfResponse) {}

  // ---- Admin: Full-server backup & restore ----
  // BackupAll snapshots EVERYTHING server-side into a timestamped JSON file in
  // the server's backup dir: every tenant's memories and conversation
  // summaries plus the user/API-key registry (credential HASHES, never
  // plaintext). Admin-only. The disaster-recovery counterpart of the
  // per-tenant Export. Vectors are not included; a restore re-embeds.
  rpc BackupAll(BackupAllRequest) returns (BackupAllResponse) {}
  // ListBackups lists the full-backup files in the server's backup dir,
  // newest first. Admin-only.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse) {}
  // ListS3Backups lists the full-backup objects in the configured offsite (S3)
  // bucket/prefix, newest first. FailedPrecondition when S3 is not configured.
  // Admin-only.
  rpc ListS3Backups(ListS3BackupsRequest) returns (ListS3BackupsResponse) {}
  // RestoreAll restores a BackupAll file: from the server's backup dir (name),
  // from raw uploaded bytes (data), or downloaded from the offsite S3 bucket
  // (s3_key). It recreates missing users and API keys (existing ones are left
  // untouched), ensures tenants, then re-queues every record into its original
  // tenant via the index queue (the worker re-embeds). Upsert-by-id makes it
  // safe to re-run. Admin-only.
  rpc RestoreAll(RestoreAllRequest) returns (RestoreAllResponse) {}
  // DownloadBackup returns the raw content of a full-backup file from the
  // server's backup dir, so an admin can keep offline copies. Admin-only.
  rpc DownloadBackup(DownloadBackupRequest) returns (DownloadBackupResponse) {}
  // DeleteBackup removes a full-backup file from the server's backup dir.
  // Admin-only.
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse) {}
  // NOTE: S3 offsite backup is configured entirely via server environment
  // variables (CORTEX_S3_* / AWS_*), never over RPC — credentials are never
  // stored in Weaviate or exposed to clients. The former GetS3Config /
  // SetS3Config / TestS3 RPCs were removed for that reason.

  // ---- Admin: User management (P5) ----
  // ListUsers returns all users. Admin-only; returns PermissionDenied for
  // non-admins and FailedPrecondition when multi-tenancy is disabled.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}
  // CreateUser creates a new user account. Admin-only.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}
  // DeleteUser deletes a user, cascading to their API keys and memory tenant.
  // Refuses to delete the last admin or the bootstrap admin. Admin-only.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}
  // SetUserRole promotes or demotes a user. Admin-only.
  rpc SetUserRole(SetUserRoleRequest) returns (SetUserRoleResponse) {}
  // ResetUserPassword sets a new password for a user. Admin-only.
  rpc ResetUserPassword(ResetUserPasswordRequest) returns (ResetUserPasswordResponse) {}

  // ---- Per-user: API key management (P6) ----
  // CreateApiKey mints a new API key for the authenticated caller. Returns the
  // raw key exactly once. Available to any authenticated user; returns
  // FailedPrecondition when multi-tenancy is disabled.
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse) {}
  // ListApiKeys returns the caller's API keys (label, prefix, timestamps —
  // never the secret). Scoped to the authenticated caller.
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {}
  // DeleteApiKey removes one of the caller's API keys. Returns NotFound for
  // keys that do not exist or belong to another user (existence not revealed).
  rpc DeleteApiKey(DeleteApiKeyRequest) returns (DeleteApiKeyResponse) {}

  // ---- Admin: API key management for other users (P5b) ----
  // These mirror the P6 self-service RPCs but target an arbitrary user by
  // username, letting an admin provision keys for headless/service accounts
  // without the web UI. Admin-only; FailedPrecondition when MT is disabled.
  // AdminCreateApiKey mints a new key for the named user. Returns the raw key
  // exactly once.
  rpc AdminCreateApiKey(AdminCreateApiKeyRequest) returns (AdminCreateApiKeyResponse) {}
  // AdminListApiKeys returns the named user's API keys (never the secret).
  rpc AdminListApiKeys(AdminListApiKeysRequest) returns (AdminListApiKeysResponse) {}
  // AdminDeleteApiKey removes one of the named user's API keys. Returns NotFound
  // when the key does not exist or belongs to a different user.
  rpc AdminDeleteApiKey(AdminDeleteApiKeyRequest) returns (AdminDeleteApiKeyResponse) {}
}

// Memory is one stored memory. Only `text` is ever embedded; every other field
// is filterable metadata and never participates in a vector search.
message Memory {
  string id = 1;
  string text = 2;
  string namespace = 3;
  repeated string tags = 4;
  string source = 5;
  google.protobuf.Timestamp created_at = 6;
  string model = 7; // embedding model that produced the vector (provenance)
  int32 dims = 8;   // vector dimension (provenance)
  string conversation_id = 9; // client session that created the memory (provenance)
  repeated string linked_ids = 10; // ids of memories explicitly linked to this one (bidirectional)
  // dup_candidates are ids of memories the worker flagged as likely duplicates of
  // this one at index time (vector distance within DEDUP_DISTANCE). A heuristic
  // review hint, NOT a confirmed link — the worker never deletes/merges on its
  // own; a human or the agent adjudicates via review_candidates / the graph UI.
  repeated string dup_candidates = 11;
  // not_duplicate_of are ids a reviewer confirmed are NOT duplicates of this
  // memory (bidirectional). The worker excludes these when recomputing
  // dup_candidates, so a dismissed pair is never re-flagged.
  repeated string not_duplicate_of = 12;
  // access_count is how many times this memory has surfaced as a top search hit
  // and been reinforced (the "living memory" usage signal). It only accrues when
  // reranking is enabled (RERANK_WEIGHT>0); 0 otherwise. Metadata, never embedded.
  int32 access_count = 13;
  // last_accessed_at is when this memory was last reinforced by a search hit.
  // Together with access_count it drives the decay/reinforcement re-ranking:
  // recently-used memories float up, untouched ones fade. Unset until first
  // reinforced (recency then falls back to created_at).
  google.protobuf.Timestamp last_accessed_at = 14;
  // valid_until is when this memory stops being true (time-bound facts such as "deploy
  // freeze until Friday"). Unset = never expires. Expired memories are hidden from
  // Search/List/recall unless include_expired is set, and are moved to Trash (reason
  // "expired") by the server's sweep once expired for longer than EXPIRY_GRACE.
  google.protobuf.Timestamp valid_until = 20; // numbers >= 20 for expiry fields keep clear of fields added concurrently elsewhere
}

message SaveRequest {
  string text = 1;
  string namespace = 2; // optional; server default when empty
  repeated string tags = 3;
  string source = 4; // optional; server default when empty
  string conversation_id = 5; // optional; client session ID for provenance
  // link_to carries IDs of EXISTING memories (e.g. from a prior search) that
  // this new memory should be bidirectionally linked to. The links are applied
  // by the worker right after this memory is indexed — solving the chicken/egg
  // where the new memory has no Weaviate object to link until it is indexed.
  // Missing targets are skipped (logged), never fatal.
  repeated string link_to = 6;
  // supersedes carries IDs of EXISTING memories this new memory replaces (e.g.
  // the sources gathered by Consolidate). The worker deletes each of them ONLY
  // after this memory is durably upserted, so consolidation never opens a window
  // where the merged content is lost if indexing fails. Best-effort, like
  // link_to: a missing/already-deleted source is skipped (logged), never fatal.
  // One-shot, not persisted as a property.
  repeated string supersedes = 7;
  // Optional expiry for a time-bound fact: either an absolute valid_until or a
  // relative expires_in ("7d", "36h"; days supported; > 0 and <= 10 years), not both.
  // valid_until must be in the future.
  google.protobuf.Timestamp valid_until = 20;
  string expires_in = 21;
}

message SaveResponse {
  string id = 1;
  string status = 2; // "queued"
}

message UpdateMemoryRequest {
  string id = 1;   // required: the memory to edit (e.g. from a search hit)
  // text is the new full memory text; replaces and re-embeds. Required unless the
  // request ONLY changes the expiry (valid_until / expires_in / clear_valid_until
  // with no other field set): then it may be empty. An expiry-only change — empty
  // text, or text identical to the stored text — is applied as a metadata merge
  // and never re-embeds.
  string text = 2;
  // tags is the desired tag set, applied ONLY when replace_tags is true. proto3
  // can't tell an empty list from an unset one, so replace_tags is the explicit
  // switch: it lets an editor clear all tags while letting a text-only edit (e.g.
  // from an agent) leave the existing tags untouched.
  repeated string tags = 3;
  bool replace_tags = 4;
  // namespace moves the memory when non-empty; empty keeps the current namespace.
  string namespace = 5;
  // Expiry change: set an absolute valid_until or a relative expires_in (same rules as
  // SaveRequest), or clear_valid_until to make the memory never expire. At most one of
  // the three; none = leave the stored expiry untouched.
  google.protobuf.Timestamp valid_until = 20;
  string expires_in = 21;
  bool clear_valid_until = 22;
}

message UpdateMemoryResponse {
  string id = 1;
  string status = 2; // "queued" (re-embed) or "updated" (metadata-only expiry change, applied)
}

message SearchRequest {
  string query = 1;
  string namespace = 2; // "" = server default, "*" = all namespaces
  int32 limit = 3;      // default 5
  repeated string tags = 4;         // memory must carry ALL of these
  repeated string exclude_tags = 5; // drop memories carrying ANY of these
  float max_distance = 6;           // relevance cutoff; <=0 = no cutoff
  int32 autocut = 7;                // Weaviate autocut jumps; <=0 disables
  repeated string any_tags = 8;     // memory must carry AT LEAST ONE of these
  // no_reinforce, when true, suppresses the "living memory" reinforcement this
  // search would otherwise apply to its top hit(s). Non-agent callers (the web
  // UI's browse/explore, the CLI by default) set it so human browsing does not
  // inflate the usage signal ranking depends on; the agent (MCP) leaves it false
  // so genuine recalls still count. No effect unless RERANK_WEIGHT>0 server-side.
  bool no_reinforce = 9;
  // include_expired keeps memories whose valid_until has passed (default: hidden).
  bool include_expired = 20;
}

message SearchSimilarRequest {
  string id = 1;                    // the seed memory whose neighbours to find
  string namespace = 2;             // "" = server default, "*" = all namespaces
  int32 limit = 3;                  // default 5
  repeated string tags = 4;         // neighbour must carry ALL of these
  repeated string exclude_tags = 5; // drop neighbours carrying ANY of these
  float max_distance = 6;           // relevance cutoff; <=0 = no cutoff
  int32 autocut = 7;                // Weaviate autocut jumps; <=0 disables
  repeated string any_tags = 8;     // neighbour must carry AT LEAST ONE of these
  bool include_expired = 20;        // keep neighbours whose valid_until has passed (default: hidden)
}

message Hit {
  Memory memory = 1;
  float distance = 2;
  // The best-matching chunk of a long memory. Unset for hits that matched the
  // whole-memory vector (un-chunked memories, chunking disabled, find-similar).
  Match match = 3;
}

// Match locates the part of a memory that a search matched.
message Match {
  int32 chunk_index = 1;
  string text = 2;  // the chunk text (the excerpt)
  // Character (Unicode code point) offsets of the excerpt within memory.text,
  // [start, end). Both 0 when the excerpt could not be located in the text.
  int32 start = 3;
  int32 end = 4;
}

message SearchResponse {
  repeated Hit hits = 1;
}

message SearchSimilarResponse {
  repeated Hit hits = 1;
}

// PreviewRecallRequest mirrors the `cortex hook recall` flags. Every optional
// field left unset takes the hook's default (limit 3, max_distance 0.5,
// min_chars 12, max_query_chunks 4).
message PreviewRecallRequest {
  string prompt = 1;
  string namespace = 2;                // "" = server default, "*" = all namespaces
  optional int32 limit = 3;            // 1..50: max memories injected
  optional float max_distance = 4;     // 0..2; 0 = no cutoff
  optional int32 min_chars = 5;        // 0..10000: shorter prompts are skipped
  optional int32 max_query_chunks = 6; // 0..32; 0 = every chunk, capped at 32
  // max_chars truncates each injected memory in injected_block (hook
  // --max-chars): 0..100000, 0 = no cap. Unset = the hook default (1500).
  optional int32 max_chars = 20;
}

message RecallPreviewHit {
  Memory memory = 1;
  float distance = 2;
  // query_index is the index into PreviewRecallResponse.queries of the query
  // chunk that matched this memory best.
  int32 query_index = 3;
  // reason is set on near misses only: "over_max_distance" (farther than the
  // cutoff) or "over_limit" (within the cutoff but beyond the injection limit).
  string reason = 4;
  // truncated is true when the hook would cut this memory's text to max_chars;
  // text_chars is the memory's full (trimmed) length in bytes. Injected hits only.
  bool truncated = 20;
  int32 text_chars = 21;
  // match is the chunk that matched best (injected and near-miss hits; unset for
  // whole-memory hits). excerpt_first is true when the injected text leads with
  // that excerpt instead of the memory's start (a late-chunk match a plain
  // max_chars cut would drop). Injected hits only.
  Match match = 22;
  bool excerpt_first = 23;
}

message PreviewRecallResponse {
  // skipped is true when the hook would not search at all; skip_reason is
  // "directive" (slash/bang command) or "too_short" (under min_chars).
  bool skipped = 1;
  string skip_reason = 2;
  repeated string queries = 3;            // the query chunks actually searched
  int32 total_chunks = 4;                 // chunks the prompt split into before sampling
  repeated RecallPreviewHit injected = 5; // what the hook would inject
  repeated RecallPreviewHit near_misses = 6;
  // Effective settings after defaults were applied.
  int32 limit = 7;
  float max_distance = 8;
  int32 min_chars = 9;
  int32 max_query_chunks = 10;
  // note flags what the preview cannot know (per-session dedup).
  string note = 11;
  // injected_block is the EXACT text the hook would print for context injection
  // (the <cortex-recall> block, truncation included); empty when nothing is injected.
  string injected_block = 20;
  int32 max_chars = 21; // effective per-memory cap (0 = none)
}

message GetMemoryRequest {
  string id = 1; // the memory's UUID
}

message GetMemoryResponse {
  Memory memory = 1;
}

message ListRequest {
  string namespace = 1; // "" = server default, "*" = all namespaces
  int32 limit = 2;      // default 20
  repeated string tags = 3;         // memory must carry ALL of these
  repeated string exclude_tags = 4; // drop memories carrying ANY of these
  repeated string any_tags = 5;     // memory must carry AT LEAST ONE of these
  bool include_expired = 20;        // keep memories whose valid_until has passed (default: hidden)
}

message ListResponse {
  repeated Memory memories = 1;
}

message DeleteRequest {
  string id = 1;
  // reason is recorded on the trash entry so mass deletions are filterable. Empty =
  // "delete"; otherwise one of: delete, stale-review, duplicate-review (anything
  // else is InvalidArgument).
  string reason = 2;
}

message DeleteResponse {
  string status = 1; // "deleted"
}

message BackupSelfRequest {}

message BackupSelfResponse {
  string name = 1;    // suggested filename, e.g. cortex-self-backup-<ts>.json
  bytes data = 2;     // the backup file content (versioned envelope)
  int32 memories = 3;
  int32 summaries = 4;
}

message RestoreSelfRequest {
  bytes data = 1; // content of a BackupSelf (or single-tenant BackupAll) file
}

message RestoreSelfResponse {
  int32 memories_queued = 1;
  int32 summaries_queued = 2;
  string message = 3;
}

message BackupAllRequest {}

message BackupAllResponse {
  string path = 1;     // server-side path of the written backup file
  int32 tenants = 2;   // tenants captured
  int32 memories = 3;  // memory records captured
  int32 summaries = 4; // conversation summaries captured
  int32 users = 5;     // user records captured
  int32 api_keys = 6;  // API-key records captured
  // Offsite upload outcome: "" when S3 is not configured/enabled, otherwise
  // "uploaded s3://bucket/key" or an error description. An S3 failure never
  // fails the backup itself — the local file is already written.
  string s3_result = 7;
}

message ListBackupsRequest {}

message BackupFile {
  string name = 1; // bare filename inside the backup dir (pass to RestoreAll)
  int64 size_bytes = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ListBackupsResponse {
  repeated BackupFile backups = 1; // newest first
}

message ListS3BackupsRequest {}

message ListS3BackupsResponse {
  // Newest first. BackupFile.name is the S3 object KEY (pass to RestoreAll as
  // s3_key).
  repeated BackupFile backups = 1;
}

message RestoreAllRequest {
  // Bare filename of a BackupAll file in the server's backup dir. Path
  // separators are rejected — the server never reads outside the backup dir.
  // Exactly one of name/data/s3_key must be set.
  string name = 1;
  // Raw content of a backup file uploaded from the client (`cortex restore
  // --file`), for restoring when the server's own copies are gone. Same
  // format/version checks as name-based restore.
  bytes data = 2;
  // Object key of a BackupAll file in the configured offsite (S3) bucket; the
  // server downloads it (using its env-configured credentials) and restores it.
  // Same format/version checks. FailedPrecondition when S3 is not configured.
  string s3_key = 3;
}

message RestoreAllResponse {
  int32 users_created = 1;
  int32 users_skipped = 2;    // already existed; left untouched
  int32 api_keys_created = 3;
  int32 api_keys_skipped = 4; // already existed; left untouched
  int32 memories_queued = 5;  // handed to the index queue (worker re-embeds)
  int32 summaries_queued = 6;
  string message = 7;
}

message DownloadBackupRequest {
  string name = 1; // bare filename, validated like RestoreAll.name
}

message DownloadBackupResponse {
  string name = 1;
  bytes data = 2;
}

message DeleteBackupRequest {
  string name = 1; // bare filename, validated like RestoreAll.name
}

message DeleteBackupResponse {}

message GetVersionRequest {}

message GetVersionResponse {
  // Server build version as stamped by the release pipeline, without a
  // leading "v" (e.g. "0.0.13"); "dev" for un-stamped local builds.
  string version = 1;
}

message StatusRequest {}

message StatusResponse {
  bool nats_ok = 1;
  bool weaviate_ok = 2;
  bool ollama_ok = 3;      // true when Ollama is reachable
  string model = 4;        // configured embedding model
  int32 dims = 5;          // probed embedding dimension (0 if ollama down)
  int64 memory_count = 6;  // total stored memories
  string version = 7;
  bool model_present = 8;  // true when the embedding model is pulled in Ollama
  int64 trash_count = 20;  // soft-deleted memories awaiting restore/purge (caller's tenant)
  // memory_count above counts LIVE memories only; expired_count is how many expired
  // memories (hidden from search/list, awaiting the sweep) are stored on top of it.
  int64 expired_count = 21;
}

message DoctorRequest {}

message Check {
  string name = 1;
  bool ok = 2;
  string detail = 3;
}

message DoctorResponse {
  repeated Check checks = 1;
  bool healthy = 2; // true iff every check is ok
}

message ReindexRequest {
  string namespace = 1;    // "" = server default, "*" = all
  bool force_rebuild = 2;  // permit a destructive class rebuild on dim change
}

message ReindexResponse {
  int32 republished = 1;
  bool rebuilt = 2;     // whether the class was dropped & recreated
  int32 old_dims = 3;
  int32 new_dims = 4;
  string backup_path = 5; // server-side snapshot written before any rebuild
  string message = 6;
}

enum DeadAction {
  DEAD_ACTION_UNSPECIFIED = 0;
  DEAD_ACTION_LIST = 1;
  DEAD_ACTION_REQUEUE = 2;
  DEAD_ACTION_PURGE = 3;
}

message DeadLetter {
  Memory record = 1;
  string error = 2;
  int32 deliveries = 3;
  google.protobuf.Timestamp failed_at = 4;
}

message DeadRequest {
  DeadAction action = 1;
}

message DeadResponse {
  repeated DeadLetter dead_letters = 1; // populated on LIST
  int32 affected = 2;                   // requeued or purged count
}

message IndexQueueRequest {}

message IndexQueueResponse {
  int64 pending = 1;        // messages waiting to be delivered to the worker (NumPending)
  int64 in_flight = 2;      // messages delivered, awaiting ack (NumAckPending)
  int64 dead = 3;           // dead-lettered messages preserved for inspection
  bool consumer_present = 4; // false when the worker has not (yet) created its consumer
}

message PullModelRequest {}

message PullModelResponse {
  string model = 1;  // the model that was pulled
  string status = 2; // "pulled"
}

// ConversationSummary is the ever-current digest of one conversation, unique per
// conversation_id. Only `text` is embedded; the rest is metadata.
message ConversationSummary {
  string conversation_id = 1;
  string text = 2;
  string namespace = 3;
  string source = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  string model = 7;
  int32 dims = 8;
  float distance = 9; // populated on recall (vector match to the query)
}

message SummarizeSessionRequest {
  string conversation_id = 1; // required: the conversation this summary digests
  string text = 2;            // the (possibly updated) summary text
  string namespace = 3;       // optional; server default when empty
  string source = 4;          // optional; server default when empty
}

message SummarizeSessionResponse {
  string conversation_id = 1;
  string status = 2; // "queued"
}

message RecallSessionRequest {
  string query = 1;        // natural-language description of the session to find
  string namespace = 2;    // "" = server default, "*" = all namespaces
  int32 fact_limit = 3;    // max facts to return for the matched conversation (default 50)
  float max_distance = 4;  // relevance cutoff on the summary match; <=0 = no cutoff
}

message RecallSessionResponse {
  bool matched = 1;                // false if no summary matched within the cutoff
  ConversationSummary summary = 2; // the best-matching summary (unset if !matched)
  repeated Memory facts = 3;       // facts sharing summary.conversation_id, newest first
}

message ListSummariesRequest {
  string namespace = 1; // "" = server default, "*" = all namespaces
  int32 limit = 2;      // default 20
}

message ListSummariesResponse {
  repeated ConversationSummary summaries = 1; // most-recently-updated first
}

message LinkRequest {
  string id = 1;        // one endpoint
  string target_id = 2; // the other endpoint
}

message LinkResponse {
  repeated string linked_ids = 1; // updated link set of `id`
}

message UnlinkRequest {
  string id = 1;
  string target_id = 2;
}

message UnlinkResponse {
  repeated string linked_ids = 1; // remaining link set of `id`
}

message ListDuplicateCandidatesRequest {
  string namespace = 1; // "" = server default, "*" = all namespaces
  int32 limit = 2;      // max flagged memories to return (default 50)
}

// DuplicateGroup is one flagged memory together with the existing memories it
// resembles. The candidates are resolved to full memories (text included) so a
// reviewer can judge without a second lookup; a candidate id that no longer
// exists (deleted since flagging) is omitted.
message DuplicateGroup {
  Memory memory = 1;             // the flagged memory
  repeated Memory candidates = 2; // the memories it is a likely duplicate of
}

message ListDuplicateCandidatesResponse {
  repeated DuplicateGroup groups = 1;
}

message DismissDuplicateRequest {
  string id = 1;        // one memory
  string target_id = 2; // the other memory it is confirmed NOT a duplicate of
}

message DismissDuplicateResponse {
  // not_duplicate_of is the updated confirmed-not-duplicate set of `id`.
  repeated string not_duplicate_of = 1;
}

message ConsolidateRequest {
  string topic = 1;        // natural-language description of what to consolidate
  string namespace = 2;    // "" = server default, "*" = all namespaces
  int32 limit = 3;         // max memories to gather into the cluster (default 25)
  float max_distance = 4;  // relevance cutoff on the topic match; <=0 = no cutoff
  // Tag filters scope which memories form the cluster. When ALL of tags,
  // any_tags and exclude_tags are empty (the default) there is NO tag filtering:
  // the whole topical cluster in the namespace is gathered, across every tag —
  // empty does NOT mean "only untagged memories".
  repeated string tags = 5;         // cluster member must carry ALL of these
  repeated string exclude_tags = 6; // drop members carrying ANY of these
  repeated string any_tags = 7;     // cluster member must carry AT LEAST ONE of these
  bool include_expired = 20;        // also gather expired memories (default: skipped, seeds and neighbours alike)
}

message RestoreMemoriesRequest {
  // memories to (re)ingest. Each is published to the same NATS index queue a
  // save uses, so the worker re-embeds and upserts it. Vectors on these objects
  // (if any) are ignored — recomputed by the worker. A record with empty text is
  // skipped (nothing to embed); a missing id is assigned one.
  repeated Memory memories = 1;
}

message RestoreMemoriesResponse {
  int32 queued = 1; // how many memories were accepted onto the index queue
  // expired_queued is how many of the queued records carry a lapsed valid_until. A
  // record that creates a NEW memory stays hidden from search/list until its expiry is
  // cleared or extended; one over an existing id keeps that memory's current expiry
  // (the index path never rewrites an existing expiry).
  int32 expired_queued = 20;
}

// NamespaceInfo aggregates one namespace's contents for the admin view.
message NamespaceInfo {
  string name = 1;
  int64 memory_count = 2;  // memories stored under this namespace
  int64 summary_count = 3; // conversation summaries stored under this namespace
  // last_updated is the most recent activity in the namespace: the newest memory
  // createdAt or summary updatedAt. Unset when the namespace has no timestamps.
  google.protobuf.Timestamp last_updated = 4;
  // memory_count counts live memories only; expired memories are counted here.
  int64 expired_count = 20;
}

message ListNamespacesRequest {}

message ListNamespacesResponse {
  repeated NamespaceInfo namespaces = 1; // most memories first
}

message RenameNamespaceRequest {
  string from = 1; // existing namespace to move away from
  string to = 2;   // destination namespace (created if absent, merged if present)
}

message RenameNamespaceResponse {
  int32 memories_updated = 1;
  int32 summaries_updated = 2;
}

message DeleteNamespaceRequest {
  string namespace = 1; // the namespace whose memories and summaries to delete
}

message DeleteNamespaceResponse {
  int32 memories_deleted = 1;
  int32 summaries_deleted = 2;
}

// TagInfo aggregates one tag's usage for the tag admin view.
message TagInfo {
  string name = 1;
  int64 memory_count = 2; // memories carrying this tag (summaries have no tags)
  // last_activity is the newest createdAt among memories with the tag.
  google.protobuf.Timestamp last_activity = 3;
}

message ListTagsRequest {
  string namespace = 1; // empty or "*" = all namespaces
}

message ListTagsResponse {
  repeated TagInfo tags = 1; // most memories first
}

message RenameTagRequest {
  string from = 1;
  string to = 2; // merged into if memories already carry it
  string namespace = 3; // empty or "*" = all namespaces
  // confirm_preference must be true to rename from/to the reserved `preference`
  // tag (it drives the cortex-prefs SessionStart hook).
  bool confirm_preference = 4;
}

message RenameTagResponse {
  int32 memories_updated = 1;
}

message DeleteTagRequest {
  string tag = 1;
  string namespace = 2; // empty or "*" = all namespaces
  bool confirm_preference = 3; // required to delete the reserved `preference` tag
}

message DeleteTagResponse {
  int32 memories_updated = 1;
}

message MigrateMTRequest {}

message MigrateMTResponse {
  // backup_path is the server-side snapshot written before the destructive rebuild.
  string backup_path = 1;
  // memories_exported is the count of memories captured in the snapshot.
  int32 memories_exported = 2;
  // summaries_exported is the count of summaries captured in the snapshot.
  int32 summaries_exported = 3;
  // memories_queued is the count of memories re-queued for re-import (equal to
  // memories_exported unless some had empty text and were skipped).
  int32 memories_queued = 4;
  // summaries_queued is the count of summaries re-queued for re-import.
  int32 summaries_queued = 5;
  // tenant is the bootstrap admin tenant all data was migrated into.
  string tenant = 6;
  string message = 7;
  // trash_migrated is the number of trash entries carried over into the tenant.
  int32 trash_migrated = 8;
}

message ConsolidateResponse {
  // cluster is the gathered memories: the topic's vector matches first (most
  // relevant), then their linked and duplicate-candidate neighbours, deduped and
  // capped at limit. Full memories (text included) so the client can merge them
  // without a second lookup.
  repeated Memory cluster = 1;
  // manifest is the ids in cluster, the exact set eligible to be superseded. A
  // compiled memory's SaveRequest.supersedes should only reference ids from here.
  repeated string manifest = 2;
}

// ---- P5: User management messages ----

// UserInfo is a safe, read-only view of a user record (no password hash).
message UserInfo {
  string id = 1;
  string username = 2;
  string role = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated UserInfo users = 1;
}

message CreateUserRequest {
  string username = 1;   // required
  string password = 2;   // required; hashed server-side
  string role = 3;       // "admin" or "user"; defaults to "user" when empty
}

message CreateUserResponse {
  UserInfo user = 1;
}

message DeleteUserRequest {
  string username = 1; // the user to delete (target, not the caller)
}

message DeleteUserResponse {
  string status = 1; // "deleted"
}

message SetUserRoleRequest {
  string username = 1; // the target user
  string role = 2;     // "admin" or "user"
}

message SetUserRoleResponse {
  UserInfo user = 1;
}

message ResetUserPasswordRequest {
  string username = 1;     // the target user
  string new_password = 2; // hashed server-side; never stored in plaintext
}

message ResetUserPasswordResponse {
  string status = 1; // "updated"
}

// ---- P6: API key management messages ----

// ApiKeyInfo is a safe, read-only view of an API key (no secret).
message ApiKeyInfo {
  string id = 1;
  string label = 2;
  string prefix = 3;                          // non-secret identifier (~12 chars)
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_used_at = 5; // zero if never used
}

message CreateApiKeyRequest {
  string label = 1; // human label ("laptop", "ci"); optional
}

message CreateApiKeyResponse {
  // raw_key is the full API key, returned EXACTLY ONCE. Store it now; it
  // cannot be retrieved again. Present only on creation.
  string raw_key = 1;
  ApiKeyInfo key = 2;
}

message ListApiKeysRequest {}

message ListApiKeysResponse {
  repeated ApiKeyInfo keys = 1;
}

message DeleteApiKeyRequest {
  string id = 1; // the API key object id to delete
}

message DeleteApiKeyResponse {
  string status = 1; // "deleted"
}

// ---- P5b: Admin API key management messages ----

message AdminCreateApiKeyRequest {
  string username = 1; // the target user the key is minted for
  string label = 2;    // human label ("laptop", "ci"); optional
}

message AdminCreateApiKeyResponse {
  // raw_key is the full API key, returned EXACTLY ONCE. Hand it to the user now;
  // it cannot be retrieved again.
  string raw_key = 1;
  ApiKeyInfo key = 2;
}

message AdminListApiKeysRequest {
  string username = 1; // the target user whose keys to list
}

message AdminListApiKeysResponse {
  repeated ApiKeyInfo keys = 1;
}

message AdminDeleteApiKeyRequest {
  string username = 1; // the target user who owns the key
  string id = 2;       // the API key object id to delete
}

message AdminDeleteApiKeyResponse {
  string status = 1; // "deleted"
}

// TrashEntry is a soft-deleted memory plus deletion metadata.
message TrashEntry {
  string id = 1;
  string text = 2;
  string namespace = 3;
  repeated string tags = 4;
  string source = 5;
  string conversation_id = 6;
  google.protobuf.Timestamp created_at = 7;
  repeated string linked_ids = 8;
  google.protobuf.Timestamp deleted_at = 9;
  // reason is why it was trashed: "delete", "supersedes:<id>", "namespace-delete" or "expired".
  string reason = 10;
  // valid_until is the expiry the memory carried when it was trashed (unset = none).
  google.protobuf.Timestamp valid_until = 20;
}

message ListTrashRequest {
  string namespace = 1; // empty = all namespaces
  int32 limit = 2;      // 0 = default (100)
  int32 offset = 3;
  // reason filters on the deletion reason: exact ("delete", "stale-review",
  // "namespace-delete") or a family ("supersedes" matches "supersedes:<id>").
  string reason = 4;
}

message ListTrashResponse {
  repeated TrashEntry entries = 1;
  int32 total = 2;             // entries matching the namespace filter, before paging
  int64 retention_seconds = 3; // server TRASH_RETENTION; 0 = kept forever
}

message RestoreFromTrashRequest {
  repeated string ids = 1; // explicit ids: validated all-or-nothing, max 1000
  // all restores every entry matching the optional filters below (exclusive with
  // ids). Unlike ids it is NOT all-or-nothing and has no id cap: each entry is
  // restored independently and failures (e.g. the id is live again) are counted.
  bool all = 2;
  string namespace = 3; // with all: only this namespace
  string reason = 4;    // with all: only this reason (see ListTrashRequest.reason)
}

message RestoreFromTrashResponse {
  int32 queued = 1;
  int32 failed = 2;               // entries skipped (bulk form only)
  repeated string failures = 3;   // first few "<id>: <why>" messages
  // expired_queued is how many restored memories carry an expiry that has already
  // lapsed (an entry trashed for a reason other than "expired" keeps its valid_until):
  // they come back but stay hidden from search/list until the expiry is changed.
  int32 expired_queued = 20;
}

message PurgeTrashRequest {
  repeated string ids = 1;
  bool all = 2;          // purge every entry (exclusive with ids)
  string namespace = 3;  // with all: restrict to this namespace (empty = every namespace)
  string reason = 4;     // with all: restrict to this reason (see ListTrashRequest.reason)
}

message PurgeTrashResponse {
  int32 purged = 1;
}
